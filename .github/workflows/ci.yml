name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - name: rescore only the experiments this change touches (every one when the scorer changes)
        run: |
          base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          changed=$(git diff --name-only "$base...HEAD")
          if echo "$changed" | grep -q '^\(jev_tracker\|tests\)/'; then exit 0; fi
          experiments=$(echo "$changed" | sed -n 's|^data/experiments/\([^/]*\)/.*|\1|p' | sort -u | paste -sd,)
          echo "JEV_RESCORE_EXPERIMENTS=$experiments" >> "$GITHUB_ENV"
      - run: uv run pytest -q -n auto
  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: committed dist matches the build
        run: git diff --exit-code -- public/data dist
