# R-8: what each source is asked. Source of truth; crawler/__main__.py reads one list per source.
# GitHub repository search (pushed since the window start), arXiv (all fields, terms ANDed) and
# Tavily web search take free text with quoted phrases. Hugging Face matches model ids by
# substring, so phrases are useless there and `decision-model` is the Hub tag Kev-style models carry.
github:
  - jev
  - kev
  - laya
  - systemone
  - '"system one"'
  - noul
  - '"decision model" reranker'
  - jaredpalmer/kev
huggingface:
  - jev
  - kev
  - laya
  - systemone
  - noul
  - decision-model
arxiv:
  - jev
  - kev
  - laya
  - systemone
  - '"system one"'
  - noul
  - '"decision model" reranker'
web:
  - jev
  - kev
  - laya
  - systemone
  - '"system one"'
  - noul
  - '"decision model" reranker'
  - jaredpalmer/kev
# twitter: the web list again, sent to Tavily with ` site:x.com` appended (x.com/twitter.com hosts only).
twitter:
  - jev
  - kev
  - laya
  - systemone
  - '"system one"'
  - noul
  - '"decision model" reranker'
  - jaredpalmer/kev
# hackernews: Algolia fuzzy-matches bare words (`jev` -> 613k hits), so only quoted exact phrases.
hackernews:
  - '"jaredpalmer"'
  - '"kev-4b"'
  - '"kev-27b"'
  - '"liquid d1"'
  - '"system one"'
  - '"decision model"'
# slack: Rox's own workspace (search.messages); needs SLACK_USER_TOKEN, skipped without it.
slack:
  - jev alternative
  - kev
  - laya
  - '"system one"'
  - '"decision model"'
  - reranker
