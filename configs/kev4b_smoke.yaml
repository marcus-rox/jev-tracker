# Smoke test of the Kev producer: first 2 cases, 1 L40S, noul only. ~$0.15.
name: kev4b_smoke
cases: 2
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  kev4b_noul:
    source: kev
    model: jaredpalmer/kev-4b
    method: noul_query_in_state
    max_items: 25
    max_chars: 24000
