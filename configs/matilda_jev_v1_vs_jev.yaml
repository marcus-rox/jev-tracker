# MATILDA-jev v1 (Maincode/matilda-jev-v1 @c87f575, 26.1B Qwen3.5 backbone + decision readout) vs Jev (committed answers) vs production, on the frozen 75 cases, kept-mass@k for
# k = 50..200 step 10. In-process through the release's own runtime (maincode_jev_serve.decide, matilda source), one child per request, 3 H200 shards (within the budget line of configs/kev27b_batched.yaml).
# Approved on the site; added by the daily automation.
#   uv run python -m jev_tracker.experiment run configs/matilda_jev_v1_vs_jev.yaml --wait
name: matilda_jev_v1_vs_jev
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  matilda_noul:
    source: matilda
    model: Maincode/matilda-jev-v1
    method: noul_query_in_state
    shards: 3
    concurrency: 8
  matilda_score:
    source: matilda
    model: Maincode/matilda-jev-v1
    method: score_query_in_question
    shards: 3
    concurrency: 8
