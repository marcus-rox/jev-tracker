# StartLux-Decision-9B (startlux-models/StartLux-Decision-9B: Qwen3.5 decoder + option-letter
# readout, the release's own startlux_decision runtime) vs Jev (committed answers) vs production,
# on the frozen 75 cases, kept-mass@k for k = 50..200 step 10. 3 x H100 (as Kev-9B), 12 children /
# 12,000 characters per request as configs/kev27b_batched.yaml, one in flight per GPU.
# Approved on the site; added by the daily automation.
#   uv run python -m jev_tracker.experiment run configs/startlux_decision_9b_vs_jev.yaml --wait
name: startlux_decision_9b_vs_jev
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  startlux9b_noul:
    source: startlux
    model: startlux-models/StartLux-Decision-9B
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
  startlux9b_score:
    source: startlux
    model: startlux-models/StartLux-Decision-9B
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
