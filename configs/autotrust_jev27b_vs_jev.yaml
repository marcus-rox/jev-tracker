# AutoTrust JEV-27B (autotrust/JEV-27B @962701f, Qwen3.8-27B + LoRA + 24-slot decision head) vs Jev (committed answers) vs production, on the frozen 75 cases, kept-mass@k for
# k = 50..200 step 10. In-process through the release's bare prompt and decision head (jev_tracker.autotrust, autotrust source), one child per request, 3 H200 shards (within the budget line of configs/kev27b_batched.yaml).
# Approved on the site; added by the daily automation.
#   uv run python -m jev_tracker.experiment run configs/autotrust_jev27b_vs_jev.yaml --wait
name: autotrust_jev27b_vs_jev
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  autotrust_noul:
    source: autotrust
    model: autotrust/JEV-27B
    method: noul_query_in_state
    shards: 3
    concurrency: 8
  autotrust_score:
    source: autotrust
    model: autotrust/JEV-27B
    method: score_query_in_question
    shards: 3
    concurrency: 8
