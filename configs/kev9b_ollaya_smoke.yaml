# Smoke test of the Ollaya (ONNX Runtime CUDA) producer: first 2 cases, kev:9b on 1 H100, noul
# only. The bar is bf16 Kev-9B on its own server on H100 ($5.6/1k, 5.1 GPU-s/query). ~$0.50.
name: kev9b_ollaya_smoke
cases: 2
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  kev9b_onnx_noul:
    source: ollaya
    model: kev:9b
    method: noul_query_in_state
    max_items: 25
    max_chars: 24000
    gpu: H100
    concurrency: 8
