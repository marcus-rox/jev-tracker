# Batch-size sweeps for the fan-out latency runs: every GPU model shown on the site, one warm GPU
# each, Kev's prefix cache cleared before every rep. Per point: 3 warm-up + 20 timed reps.
#   default = 1 request of 1, 2, 4, 8, 16, 32, 64, 128 children, then 2 / 4 / 8 requests of max_items.
#   Matilda / AutoTrust hold one child per request: 1, 2, 4, 8, 16 one-child requests at once.
# Weights pinned to the revisions the site rows ran (Kev-27B 9/29 runs = 01b8199, fit-macaw = v2 af0e6d5).
#   uv run python -m jev_tracker.experiment run configs/fanout_sweep_v1.yaml --wait
