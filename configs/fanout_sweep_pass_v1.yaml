# Batch-size sweeps for the pass-based engines (Laya, RSI-Jev), as fanout_sweep_v1.yaml: one warm
# GPU each, 3 warm-up + 20 timed reps per point.
#   Laya holds one child per request and runs a worker's requests in passes of forward_batch (64):
#     1, 2, 4, ..., 256 one-child requests at once.
#   RSI-Jev: default = 1 request of 1, 2, 4, ..., 128 children, then 2 / 4 / 8 requests of 12.
#   uv run python -m jev_tracker.experiment run configs/fanout_sweep_pass_v1.yaml --wait
name: fanout_sweep_pass_v1
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  laya421m_noul:
    source: laya
    model: convaiinnovations/laya
    method: noul_query_in_state
    shards: 1
    forward_batch: 64
    gpu: L4
    fanout: true
    sweep:
      - {requests: 1, children: 1}
      - {requests: 2, children: 1}
      - {requests: 4, children: 1}
      - {requests: 8, children: 1}
      - {requests: 16, children: 1}
      - {requests: 32, children: 1}
      - {requests: 64, children: 1}
      - {requests: 128, children: 1}
      - {requests: 256, children: 1}
  laya421m_score:
    source: laya
    model: convaiinnovations/laya
    method: score_query_in_question
    shards: 1
    forward_batch: 64
    gpu: L4
    fanout: true
