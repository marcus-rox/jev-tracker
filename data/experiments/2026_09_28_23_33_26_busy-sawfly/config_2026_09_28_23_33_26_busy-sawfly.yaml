# kev27b_fp8.yaml on H100 ($3.95/h vs H200 $4.54/h): FP8 halves resident weights (55 -> ~28 GB), the
# 80 GB card that OOM'd bf16 at 25 children (actual-clam) should now hold 12-child batches.
#   uv run python -m projects.reranker_alts.experiment run projects/reranker_alts/configs/kev27b_fp8_h100.yaml --wait
name: kev27b_fp8_h100
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: projects/reranker_alts/data/jev/noul_query_in_state.json
  jev_score:
    source: answers
    method: score_query_in_question
    path: projects/reranker_alts/data/jev/score_query_in_question.json
  kev27b_bf16_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100
  kev27b_bf16_score:
    source: kev
    model: jaredpalmer/kev-27b
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100
  kev27b_FP8_wo_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100
    fp8: wo
  kev27b_FP8_wo_score:
    source: kev
    model: jaredpalmer/kev-27b
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100
    fp8: wo
  kev27b_FP8_w8a8_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100
    fp8: w8a8
  kev27b_FP8_w8a8_score:
    source: kev
    model: jaredpalmer/kev-27b
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100
    fp8: w8a8
