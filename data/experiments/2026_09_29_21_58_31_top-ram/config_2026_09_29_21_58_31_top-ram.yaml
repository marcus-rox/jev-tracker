# The three official Laya checkpoints on all 75 cases (4 L4s per arm), next to Jev's committed answers.
# One child per request (LayaSource). _noul / _score = Jev's exact wording (as jev_noul, kev27b_noul);
# _noul_reworded = the query moved into the noul question (noul_query_in_question).
name: laya_sizes
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: projects/reranker_alts/data/jev/noul_query_in_state.json
  jev_score:
    source: answers
    method: score_query_in_question
    path: projects/reranker_alts/data/jev/score_query_in_question.json
  laya421m_noul:
    source: laya
    model: convaiinnovations/laya
    method: noul_query_in_state
    shards: 4
    forward_batch: 64
  laya421m_score:
    source: laya
    model: convaiinnovations/laya
    method: score_query_in_question
    shards: 4
    forward_batch: 64
  laya421m_noul_reworded:
    source: laya
    model: convaiinnovations/laya
    method: noul_query_in_question
    shards: 4
    forward_batch: 64
  laya322m_multilingual_noul:
    source: laya
    model: convaiinnovations/laya-multilingual
    method: noul_query_in_state
    shards: 4
    forward_batch: 64
  laya322m_multilingual_score:
    source: laya
    model: convaiinnovations/laya-multilingual
    method: score_query_in_question
    shards: 4
    forward_batch: 64
  laya322m_multilingual_noul_reworded:
    source: laya
    model: convaiinnovations/laya-multilingual
    method: noul_query_in_question
    shards: 4
    forward_batch: 64
  laya421m_typed_noul:
    source: laya
    model: convaiinnovations/laya-typed-decisions
    method: noul_query_in_state
    shards: 4
    forward_batch: 64
  laya421m_typed_score:
    source: laya
    model: convaiinnovations/laya-typed-decisions
    method: score_query_in_question
    shards: 4
    forward_batch: 64
  laya421m_typed_noul_reworded:
    source: laya
    model: convaiinnovations/laya-typed-decisions
    method: noul_query_in_question
    shards: 4
    forward_batch: 64
