# Same batched serving as kev27b_fp8_h100.yaml (12 children, 16 in flight, 3 containers) on GPUs cheaper
# than the H100 ($3.95/h): A100-80GB $2.50/h (Ampere: bf16 only, no FP8 tensor cores), RTX PRO 6000 96 GB
# $3.03/h (Blackwell). L40S ($1.95/h) was tried (w8a8, 8 in flight) in `living-wahoo` and OOMed at load:
# only 44.4 GiB of its 48 GB is usable, under w8a8's 41 GB resident + CUDA-graph buffers.
# "H100!" pins a real H100 so the reference row is not silently upgraded to an H200.
#   uv run python -m projects.reranker_alts.experiment run projects/reranker_alts/configs/kev27b_cheap_gpu.yaml --wait
name: kev27b_cheap_gpu
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: projects/reranker_alts/data/jev/noul_query_in_state.json
  kev27b_batched_H100_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100!
  kev27b_batched_A100_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: A100-80GB
  kev27b_batched_RTXPRO6000_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: RTX-PRO-6000
  kev27b_FP8_w8a8_RTXPRO6000_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: RTX-PRO-6000
    fp8: w8a8
