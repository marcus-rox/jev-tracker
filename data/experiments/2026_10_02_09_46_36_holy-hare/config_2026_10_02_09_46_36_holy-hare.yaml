# Kev-0.5B (jaredpalmer/kev-0.5b, the superseded Qwen2.5-0.5B prototype: head.pt + LoRA) vs Jev
# (committed answers) vs production, on the frozen 75 cases, kept-mass@k for k = 50..200 step 10.
# Serving as configs/kev27b_batched.yaml (the budget line): 3 shards, 12 children per request,
# 16 requests in flight per container. Approved on the site; added by the daily automation.
#   uv run python -m jev_tracker.experiment run configs/kev05b_vs_jev.yaml --wait
name: kev05b_vs_jev
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  kev05b_noul:
    source: kev
    model: jaredpalmer/kev-0.5b@9ce2fd39db3a397c89733f94af948e3d1fdfffcd
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: L4
  kev05b_score:
    source: kev
    model: jaredpalmer/kev-0.5b@9ce2fd39db3a397c89733f94af948e3d1fdfffcd
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: L4
