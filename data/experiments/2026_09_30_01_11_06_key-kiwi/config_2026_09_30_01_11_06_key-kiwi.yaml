# H-2: Liquid AI's d1 on all 75 cases next to Jev's committed answers, Jev's questions unchanged.
# As many children per request as d1 takes (LiquidSource: 128 questions, 110,000 characters),
# 8 requests in flight; d1_noul_rerun repeats d1_noul to show the run-to-run spread.
name: liquid_d1_vs_jev
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: projects/reranker_alts/data/jev/noul_query_in_state.json
  jev_score:
    source: answers
    method: score_query_in_question
    path: projects/reranker_alts/data/jev/score_query_in_question.json
  d1_noul:
    source: liquid
    method: noul_query_in_state
  d1_score:
    source: liquid
    method: score_query_in_question
  d1_noul_rerun:
    source: liquid
    method: noul_query_in_state
