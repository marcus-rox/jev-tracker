# Kev-9B v2 (jaredpalmer/kev-9b, round-27 weights since 2026-09-30) vs Jev (committed answers) vs production, on the frozen 75 cases, kept-mass@k for
# k = 50..200 step 10. Serving as configs/kev27b_batched.yaml (the budget line): 3 shards,
# 12 children per request, 16 requests in flight per container. Added by the daily automation.
#   uv run python -m jev_tracker.experiment run configs/kev9b_v2_vs_jev.yaml --wait
name: kev9b_v2_vs_jev
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: data/jev/noul_query_in_state.json.gz
  jev_score:
    source: answers
    method: score_query_in_question
    path: data/jev/score_query_in_question.json.gz
  kev9b_noul:
    source: kev
    model: jaredpalmer/kev-9b@db029f08b290afd9fee4aa4bbcd9ae48602d1eb0
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
  kev9b_score:
    source: kev
    model: jaredpalmer/kev-9b@db029f08b290afd9fee4aa4bbcd9ae48602d1eb0
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
