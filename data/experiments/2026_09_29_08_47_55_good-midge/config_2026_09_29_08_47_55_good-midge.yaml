# R-1 baseline: Kev-27B batched serving (as kev27b_batched.yaml) re-run with the split timers
# (metrics.py: load / warm / in-function per shard, per-query wall clock), on H100 80GB without
# Modal's upgrade to H200 ("H100!"), all 75 cases. The reference every hypothesis is measured against.
#   uv run python -m projects.reranker_alts.experiment run projects/reranker_alts/configs/kev27b_timed.yaml --wait
name: kev27b_timed
cases: null
k: {start: 50, stop: 200, step: 10}
rerankers:
  prod:
    source: production
  jev_noul:
    source: answers
    method: noul_query_in_state
    path: projects/reranker_alts/data/jev/noul_query_in_state.json
  jev_score:
    source: answers
    method: score_query_in_question
    path: projects/reranker_alts/data/jev/score_query_in_question.json
  kev27b_noul:
    source: kev
    model: jaredpalmer/kev-27b
    method: noul_query_in_state
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100!
  kev27b_score:
    source: kev
    model: jaredpalmer/kev-27b
    method: score_query_in_question
    max_items: 12
    max_chars: 12000
    shards: 3
    concurrency: 16
    gpu: H100!
